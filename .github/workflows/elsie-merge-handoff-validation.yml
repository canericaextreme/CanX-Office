name: Elsie merge-handoff validation
on:
  push:
    branches: [chatgpt/elsie-worker-phase5-20261017]
  pull_request:
    paths:
      - src/lib/elsie-merge-handoff.ts
      - src/lib/elsie-merge-handoff.test.ts
      - .github/workflows/elsie-merge-handoff-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run src/lib/elsie-merge-handoff.test.ts
      - run: bun run build
