# General build check for every pull request into main (issue #142). The CanX merge robot requires this
# check ("pr-checks") to be green on the latest commit before it will merge anything.
name: CanX PR checks
on:
  pull_request:
    branches: [main]
    # ready_for_review: builder drafts are opened by the workflow token, which starts no checks;
    # marking one ready now runs pr-checks so the merge robot can judge it.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: canx-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
      - name: Merge robot rule tests
        run: node --test scripts/automerge/*.nodetest.mjs scripts/office-db/*.nodetest.mjs
