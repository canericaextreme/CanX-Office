# CanX Office view capture (approved by John 10 Oct 2026). No stored secret: uses GitHub's own short-lived identity token.
# Accepted by the view service only from this exact file on main. Uploads no artifacts.
name: CanX Office view capture
run-name: CanX Office view capture ${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Capture request id (UUID)
        required: true
        type: string
permissions: {}
concurrency:
  group: canx-office-view
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      CANX_VIEW_BROKER_URL: ${{ vars.CANX_VIEW_BROKER_URL || 'https://gmsjjiprtulxojhkmbqb.supabase.co/functions/v1/office-view' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/capture
          sparse-checkout-cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The assistant waits about 60s for a picture. Downloading Chromium took ~80s, so use the
      # runner's preinstalled Chrome and only download a browser when it is missing.
      - name: Install the browser (pinned, no project dependencies)
        id: browser
        run: |
          start=$SECONDS
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts playwright@1.49.1
          echo "::notice title=Capture timing::playwright package installed after $((SECONDS - start))s"
          if command -v google-chrome >/dev/null; then
            echo "channel=chrome" >> "$GITHUB_OUTPUT"
            echo "::notice title=Capture timing::using the runner's Chrome ($(google-chrome --version))"
          else
            echo "::notice title=Capture timing::no runner Chrome, downloading Chromium"
            npx playwright install --with-deps chromium
          fi
          echo "::notice title=Capture timing::browser ready after $((SECONDS - start))s"
      - name: Capture
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CANX_CAPTURE_CHANNEL: ${{ steps.browser.outputs.channel }}
        run: node scripts/capture/run-capture.mjs --request-id "$REQUEST_ID"
