name: Elsie room open validation
on:
  pull_request:
    paths:
      - src/lib/manager-room-commands.ts
      - src/lib/manager-room-commands.test.ts
      - .github/workflows/elsie-room-open-names-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
