name: Elsie voice recent memory validation
on:
  pull_request:
    paths:
      - src/lib/astra-continuity.ts
      - src/lib/manager-realtime.functions.ts
      - src/lib/elsie-voice-recent-memory.test.ts
      - .github/workflows/elsie-voice-memory-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
