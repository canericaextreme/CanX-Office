name: Elsie voice single save validation
on:
  pull_request:
    paths:
      - src/components/office/OfficeManager.tsx
      - src/lib/voice-turns.ts
      - src/lib/astra-voice-memory.test.ts
      - src/lib/astra-persistent-conversation.test.ts
      - .github/workflows/elsie-voice-single-save-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
