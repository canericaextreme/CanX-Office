name: Elsie voice default validation
on:
  pull_request:
    paths:
      - src/components/office/OfficeManager.tsx
      - src/lib/use-realtime-manager.ts
      - src/lib/elsie-voice-default.test.ts
      - .github/workflows/elsie-voice-default-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
