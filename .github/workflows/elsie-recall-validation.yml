name: Elsie recall validation
on:
  push:
    branches: [chatgpt/elsie-recall-answer-20261017]
  pull_request:
    paths:
      - src/lib/manager.functions.ts
      - src/lib/elsie-recall-instructions.test.ts
      - .github/workflows/elsie-recall-validation.yml
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run src/lib/elsie-recall-instructions.test.ts src/lib/elsie-reconnect-brief.test.ts src/lib/astra-continuity.test.ts
      - run: bun run build
