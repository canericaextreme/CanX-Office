name: Elsie voice noise validation
on:
  pull_request:
    paths:
      - src/lib/manager-realtime.functions.ts
      - src/lib/use-realtime-manager.ts
      - src/lib/voice-turn-refresh.test.ts
      - .github/workflows/elsie-voice-noise-validation.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
