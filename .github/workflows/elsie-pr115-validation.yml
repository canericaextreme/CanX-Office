name: Elsie handoff draft validation
on:
  pull_request:
    paths:
      - 'src/lib/builder-choice.ts'
      - 'src/lib/elsie-*.ts'
      - 'src/lib/astra-continuity.ts'
      - 'src/lib/manager.functions.ts'
      - 'src/lib/task-execution*.ts'
      - 'src/lib/codex-task-handoff.ts'
      - 'src/lib/builder-connections.test.ts'
      - 'supabase/migrations/*elsie*'
      - '.github/workflows/elsie-pr115-validation.yml'
  push:
    branches:
      - 'chatgpt/elsie-handoff-intent-20261015'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run
      - run: bun run build
