name: Elsie handoff draft validation
on:
  pull_request:
    paths:
      - 'src/lib/builder-choice.ts'
      - 'src/lib/elsie-*.ts'
      - 'src/lib/task-execution*.ts'
      - 'supabase/migrations/*elsie*'
      - '.github/workflows/elsie-pr115-validation.yml'
  push:
    branches:
      - 'chatgpt/elsie-handoff-intent-20261015'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run src/lib/elsie-handoff-intent.test.ts src/lib/elsie-task-queue.test.ts src/lib/task-execution.test.ts
      - run: bun run build
