name: Analytics draft validation
on:
  push:
    branches: [chatgpt/analytics-overview-20261016]
  pull_request:
    paths:
      - src/routes/_office/analytics.tsx
      - .github/workflows/analytics-draft-validation.yml
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run src/routes/_office/analytics.test.ts
      - run: bun run build
